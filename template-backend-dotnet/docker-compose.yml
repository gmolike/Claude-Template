services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '5000:5000'
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database={{PROJECT_NAME}};Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: '{{PROJECT_NAME}}'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
